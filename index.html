<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki - UNO Caótico</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #2e2e2e; /* Fundo cinza escuro da sua imagem */
      color: #ffffff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 420px;
      background-color: #000000;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.3rem;
    }

    .wiki-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Estrutura de cada Carta */
    .card-entry {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Linha Superior: Imagem na Esquerda + Descrição na Direita */
    .card-top-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      width: 100%;
    }

    /* 1. QUADRO DA ESQUERDA: IMAGEM DA CARTA */
    .card-image-box {
      width: 130px;
      height: 190px;
      min-width: 130px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Mantém a proporção exata da imagem da carta */
      border-radius: 8px;
    }

    /* 2. QUADRO DA DIREITA: DESCRIÇÃO */
    .card-desc-box {
      flex: 1;
      background-color: #1e1e24;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border: 1px solid #444;
    }

    .card-desc-box h2 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #ff5252;
    }

    .card-desc-box p {
      font-size: 0.85rem;
      line-height: 1.35;
      color: #d1d1d6;
    }

    /* 3. QUADRO INFERIOR: BUFFS */
    .card-buff-box {
      width: 100%;
      background-color: #262030;
      border-left: 5px solid #a855f7;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.35;
      color: #e2d9f3;
      border-top: 1px solid #3d2f50;
      border-right: 1px solid #3d2f50;
      border-bottom: 1px solid #3d2f50;
    }

    .card-buff-box strong {
      display: block;
      color: #c084fc;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎴 UNO Caótico: Wiki</h1>
  </header>

  <main class="wiki-container">

    <!-- CARTA 1: CURSED -->
    <article class="card-entry">
      <div class="card-top-row">
        
        <!-- IMAGEM EXPORTADA DO CANVA -->
        <div class="card-image-box">
          <img src="cursed.png" alt="Carta Cursed">
        </div>

        <!-- DESCRIÇÃO -->
        <div class="card-desc-box">
          <h2>Cursed</h2>
          <p>Dobra todas as cartas recebidas e toda rodada deve comprar uma carta.</p>
        </div>
      </div>

      <!-- BUFFS -->
      <div class="card-buff-box">
        <strong>⚡ Buffs / c/ Carta Melhoria:</strong>
        <span>Aplica o efeito a todos, menos a quem o jogou, além dos debuffs serem dobrados.</span>
      </div>
    </article>

  </main>

</body>
</html>
