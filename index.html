<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki - UNO Caótico</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #2e2e2e;
      color: #ffffff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 1. BARRA PRETA NO TOPO (SEM TEXTO) */
    header {
      width: 100%;
      max-width: 420px;
      height: 45px;
      background-color: #000000;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .wiki-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .card-entry {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .card-top-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      width: 100%;
    }

    /* QUADRO DA CARTA */
    .uno-card {
      width: 130px;
      height: 190px;
      min-width: 130px;
      max-width: 130px;
      background-color: #d71921;
      border: 3.5px solid #000000;
      border-radius: 16px;
      position: relative;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* CRUZES TODAS EM PÉ */
    .card-corner {
      width: 18px;
      height: 18px;
      z-index: 2;
    }

    .card-corner svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .top-left {
      align-self: flex-start;
    }

    .bottom-right {
      align-self: flex-end;
      /* Sem rotação para a cruz ficar em pé */
    }

    .card-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-icon {
      width: 55px;
      height: 55px;
      display: block;
    }

    /* QUADRO DA DESCRIÇÃO */
    .card-desc-box {
      flex: 1;
      background-color: #1e1e24;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border: 1px solid #444;
    }

    .card-desc-box h2 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #ff5252;
    }

    .card-desc-box p {
      font-size: 0.85rem;
      line-height: 1.35;
      color: #d1d1d6;
    }

    /* QUADRO DE BUFFS */
    .card-buff-box {
      width: 100%;
      background-color: #262030;
      border-left: 5px solid #a855f7;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.35;
      color: #e2d9f3;
      border-top: 1px solid #3d2f50;
      border-right: 1px solid #3d2f50;
      border-bottom: 1px solid #3d2f50;
    }

    .card-buff-box strong.label {
      display: block;
      color: #c084fc;
      margin-bottom: 4px;
    }

    .buff-name {
      color: #ff79c6;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- BARRA PRETA NO TOPO -->
  <header></header>

  <main class="wiki-container">

    <!-- CARTA 1: CURSED -->
    <article class="card-entry">
      <div class="card-top-row">

        <!-- CARTA COM CRUZES EM PÉ -->
        <div class="uno-card">
          <div class="card-corner top-left">
            <svg viewBox="0 0 24 24"><path d="M 10 2 H 14 V 6 H 21 V 10 H 14 V 22 H 10 V 10 H 3 V 6 H 10 Z" fill="#000000"/></svg>
          </div>
          
          <div class="card-center">
            <svg viewBox="0 0 24 24" class="center-icon"><path d="M 10 2 H 14 V 6 H 21 V 10 H 14 V 22 H 10 V 10 H 3 V 6 H 10 Z" fill="#000000"/></svg>
          </div>
          
          <div class="card-corner bottom-right">
            <svg viewBox="0 0 24 24"><path d="M 10 2 H 14 V 6 H 21 V 10 H 14 V 22 H 10 V 10 H 3 V 6 H 10 Z" fill="#000000"/></svg>
          </div>
        </div>

        <!-- DESCRIÇÃO -->
        <div class="card-desc-box">
          <h2>Cursed</h2>
          <p>Dobra todas as cartas recebidas e toda rodada deve comprar uma carta.</p>
        </div>
      </div>

      <!-- BUFFS / CARTA MELHORIA -->
      <div class="card-buff-box">
        <strong class="label">⚡ Buffs / Carta Melhoria:</strong>
        <span><span class="buff-name">Cursed of World:</span> aplica o efeito a todos, menos a quem o jogou, além dos debuffs serem dobrados.</span>
      </div>
    </article>

  </main>

</body>
</html>
